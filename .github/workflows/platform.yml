name: Platform checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '${{ matrix.python }}'
      - run: pip install -e '.[dev]'
      - run: python -m pytest -q
      - run: python -m ga4_platform.cli evaluate-agent
      - run: python -m ga4_platform.cli evaluate-agent --simulate --output /tmp/agent-simulated.json
      - run: python scripts/plot_results.py
