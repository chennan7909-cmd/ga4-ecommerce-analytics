[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ga4-predictive-analytics"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["pandas>=2.2,<3", "numpy>=1.26,<3", "scikit-learn>=1.5,<2", "lightgbm>=4.5,<5", "shap>=0.46,<1", "sqlglot>=26,<31", "matplotlib>=3.8,<4"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]
bigquery = ["google-cloud-bigquery>=3.25,<4"]

[project.scripts]
ga4-platform = "ga4_platform.cli:main"

[tool.setuptools.packages.find]
include = ["ga4_platform*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
